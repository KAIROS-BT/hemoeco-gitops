name: deploy
on:
  push:
    branches: [main]
    paths: ['infra/**']
permissions:
  id-token: write
  contents: read
env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar etiquetas (gate)
        run: python3 scripts/validate_tags.py infra/tags.auto.tfvars.json policy/tagging-standard.json

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    environment: prod   # exige aprobacion manual si la configuras en el repo
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=hemoeco-gitops.tfstate"
      - name: Plan
        run: terraform plan -out tfplan
      - name: Apply
        run: terraform apply -auto-approve tfplan
